[project]
name = "cy-th"
version = "0.1.0"
description = "A chatbot-based application for answering queries about DoD contract awards"
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
]
openai = [
    "openai>=1.66",
]

[project.scripts]
cyth = "cy_th.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cy_th"]

[tool.uv]
default-groups = ["dev"]

# CUDA 13.0 wheels (without this, it'll often resolve to CPU-only torch)
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not semantic_model",
    "--cov=cy_th",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "network: hits USASpending when local cache/TEMP extracts are unavailable",
    "semantic_model: optional smoke using the real sentence-transformers model",
]

[tool.coverage.run]
branch = true
source = ["cy_th"]
omit = ["*/cy_th/cli.py", "*/cy_th/__main__.py", "*/cy_th/agent/providers/*", "*/cy_th/ingest/client.py", "*/cy_th/enrichment/client.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
extraPaths = ["src", "."]
